<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Store</h1>
        <p>Select products and add them to your cart.</p>
    </header>

    <main>
        <section class="products">
            <h2>Products</h2>

            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Accessories">Accessories</option>
                <option value="Audio">Audio</option>
                <option value="Storage">Storage</option>
            </select>

            <div id="productList" class="product-list"></div>
        </section>

        <section class="cart">
            <h2>Shopping Cart</h2>
            <div id="cartItems"></div>
            <h3>Total: ৳<span id="total">0</span></h3>
            <button id="checkout">Proceed to Payment</button>
        </section>
    </main>

    <section id="customerForm" class="panel hidden">
        <h2>Customer Information</h2>
        <input id="customerName" placeholder="Customer name">
        <input id="customerPhone" type="tel" placeholder="Phone number">
        <button id="makeReceipt">Generate Payment Slip</button>
    </section>

    <section id="receipt" class="panel hidden"></section>

</body>
</html>
